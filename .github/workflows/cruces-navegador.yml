name: Cruces espaciales en Chrome
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/cruces-espaciales]
permissions:
  contents: read
jobs:
  visor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portalgis/gis-core build && pnpm --filter @portalgis/shared build && pnpm --filter @portalgis/api build
      - run: python -m pip install playwright==1.62.0
      - name: Ejecutar la matriz desde Estadísticas → Cruzada
        shell: bash
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export DATA_DIR="$RUNNER_TEMP/snapshots"
          export EVIDENCE_DIR="$RUNNER_TEMP/evidencia"
          mkdir -p "$EVIDENCE_DIR"
          python tests/cruces/snapshots.py "$DATA_DIR"
          node tests/cruces/api.cjs > "$EVIDENCE_DIR/api.log" 2>&1 &
          api_pid=$!
          (cd apps/web && exec node_modules/.bin/vite --host 127.0.0.1 --port 3100 --strictPort) > "$EVIDENCE_DIR/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:3100/api/catalog/tree > /dev/null
          python tests/cruces/visor.py | tee "$EVIDENCE_DIR/matriz.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cruces-navegador
          path: ${{ runner.temp }}/evidencia/
